name: Build Android arm64-v8a tmpfile

on:
  workflow_dispatch:

jobs:
  build-android-arm64-v8a-tmpfile:
    name: Build Android arm64-v8a tmpfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write signing config
        shell: bash
        run: |
          test -f android/app/TestKey.jks
          cat > android/key.properties <<'EOF'
          storeFile=TestKey.jks
          storePassword=123321
          keyAlias=Test
          keyPassword=123321
          EOF

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build Android arm64-v8a APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define-from-file=pili_release.json --pub

      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "PiliPlus_android_${{ env.version }}_arm64-v8a.apk"

      - name: Upload Android arm64-v8a APK to tmpfile.link
        shell: bash
        run: |
          set -euo pipefail
          file="PiliPlus_android_${{ env.version }}_arm64-v8a.apk"
          response="$(curl -sS -X POST -F "file=@${file}" https://tmpfile.link/api/upload)"
          echo "${response}"
          download="$(printf '%s' "${response}" | jq -r '.downloadLinkEncoded // empty')"
          if [ -z "${download}" ]; then
            echo "tmpfile.link upload failed: ${response}" >&2
            exit 1
          fi
          {
            echo "## Android arm64-v8a build"
            echo
            echo "- File: \`${file}\`"
            echo "- Download: ${download}"
            echo "- Retention: tmpfile.link anonymous uploads are deleted after 7 days."
          } >> "${GITHUB_STEP_SUMMARY}"
